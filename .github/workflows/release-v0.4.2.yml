name: Publish certified v0.4.2

on:
  push:
    branches:
      - release/v0.4.2-staging
    paths:
      - ".release-staging/v0.4.2/**"
      - ".github/workflows/release-v0.4.2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct certified APK
        shell: bash
        run: |
          set -euxo pipefail
          OUT="/tmp/ATAK-Plugin-Jarnsen-Mrs-0.4.2-5.6.0-TAKgov-signed.apk"
          cat .release-staging/v0.4.2/part-*.txt | tr -d '\n\r' | base64 -d > "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Verify certified APK
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED="247835e440248dbd21665eff4e177e98c2de230ce8389bf70bf964f1474c90d8"
          ACTUAL="$(sha256sum "$APK" | awk '{print $1}')"
          echo "SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          jarsigner -verify -verbose -certs "$APK" | tee /tmp/jarsigner.txt
          grep -F "CN=TAK Product Center ATAK Untrusted Plugin Release" /tmp/jarsigner.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="v0.4.2"
          TITLE="Jarnsen Mrs Plugin 0.4.2 – ATAK-CIV 5.6.0"
          TARGET="3e83fc8d893980d2c33710a607034716e672045c"
          NOTES=".release-staging/v0.4.2/RELEASE_NOTES.md"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          fi
