name: Verify ATAK 5.6 Plugin Signing

on:
  push:
    branches:
      - feat/atak-5.6.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download official ATAK 5.5.1.8 Plugin SDK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/atak-sdk /tmp/atak-sdk.zip
          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/atak-sdk.zip \
            "https://github.com/TAK-Product-Center/atak-civ/releases/download/5.5.1.8/ATAK-CIV-5.5.1.8-SDK.zip"
          mkdir -p /tmp/atak-sdk
          unzip -q /tmp/atak-sdk.zip -d /tmp/atak-sdk
          find /tmp/atak-sdk -type f \( -name 'android_keystore' -o -name '*.jks' -o -name '*.keystore' \) -print

      - name: Compare SDK certificate with ATAK 5.6 whitelist
        shell: bash
        run: |
          set -euxo pipefail

          KEYSTORE="$(find /tmp/atak-sdk -type f -name 'android_keystore' | head -n 1)"
          test -f "$KEYSTORE"

          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass tnttnt \
            -alias wintec_mapping

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass tnttnt \
            -alias wintec_mapping \
            -file /tmp/plugin-sdk-cert.der

          CERTHEX="$(xxd -p -c 1000000 /tmp/plugin-sdk-cert.der | tr -d '\n' | tr 'A-F' 'a-f')"

          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/AtakPluginRegistry.java \
            "https://raw.githubusercontent.com/TAK-Product-Center/atak-civ/main/atak/ATAK/app/src/main/java/com/atak/plugins/impl/AtakPluginRegistry.java"

          echo "Certificate length: ${#CERTHEX}"

          if grep -Fqi "$CERTHEX" /tmp/AtakPluginRegistry.java; then
            echo "MATCH: Official Plugin SDK certificate is accepted by ATAK 5.6 Release."
          else
            echo "NO MATCH: Official Plugin SDK certificate is not accepted by ATAK 5.6 Release."
            exit 42
          fi
