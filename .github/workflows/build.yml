name: Build ATAK Plugin

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ATAK_VERSION: "5.6.0"
  ATAK_CIV_SOURCE_SHA: "9f6893dd657feacc35ec5de03dad721c2e44170e"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build environment
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "SDKROOT=$SDKROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;25.1.8937393"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Checkout official ATAK-CIV 5.6 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/atak-civ
          GIT_LFS_SKIP_SMUDGE=1 git clone --filter=blob:none --no-checkout \
            https://github.com/TAK-Product-Center/atak-civ.git /tmp/atak-civ
          git -C /tmp/atak-civ fetch --depth 1 origin "$ATAK_CIV_SOURCE_SHA"
          git -C /tmp/atak-civ checkout --detach "$ATAK_CIV_SOURCE_SHA"

          grep -n "ATAK_VERSION = '5.6.0'" \
            /tmp/atak-civ/plugin-examples/helloworld/app/build.gradle

      - name: Build ATAK 5.6 TakDev Gradle plugin
        shell: bash
        working-directory: /tmp/atak-civ/atak-gradle-takdev
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :atak-gradle-takdev:jar

      - name: Build ATAK 5.6 API jar
        shell: bash
        working-directory: /tmp/atak-civ/atak
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :ATAK:app:combineJarsDebug

      - name: Prepare ATAK 5.6 DevKit files
        shell: bash
        run: |
          set -euxo pipefail

          TAKDEV="$(find /tmp/atak-civ/atak-gradle-takdev/atak-gradle-takdev/build/libs -type f -name 'atak-gradle-takdev*.jar' | head -n 1)"
          MAINJAR="/tmp/atak-civ/atak/ATAK/app/build/libs/main.jar"
          KEYSTORE="/tmp/atak-civ/atak/android_keystore"
          CORERULES="/tmp/atak-civ/atak/ATAK/app/proguard-release-keep.txt"

          echo "TAKDEV=$TAKDEV"
          echo "MAINJAR=$MAINJAR"
          echo "KEYSTORE=$KEYSTORE"
          echo "CORERULES=$CORERULES"

          test -f "$TAKDEV"
          test -f "$MAINJAR"
          test -f "$KEYSTORE"
          test -f "$CORERULES"

          cp "$TAKDEV" ./atak-gradle-takdev.jar

          mkdir -p sdk
          cp "$MAINJAR" sdk/main.jar
          cp "$KEYSTORE" sdk/android_keystore
          cp "$CORERULES" sdk/proguard-release-keep.txt
          : > sdk/mapping.txt

      - name: Build Jarnsen Mrs Plugin for ATAK 5.6.0
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleCivDebug

      - name: Show APKs
        if: always()
        shell: bash
        run: |
          find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload plugin APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarnsen-Mrs-Plugin-ATAK-5.6.0
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
