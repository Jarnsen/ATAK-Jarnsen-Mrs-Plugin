name: Build ATAK Plugin

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ATAK_VERSION: "5.6.0"
  ATAK_CIV_SOURCE_SHA: "9f6893dd657feacc35ec5de03dad721c2e44170e"
  ATAK_PUBLIC_SDK_SHA256: "c92139d4600f6684fcf9b640fc0fb67a6105940e9bdc2e578ae26f08f477bf56"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build environment
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "SDKROOT=$SDKROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;25.1.8937393"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Checkout official ATAK-CIV 5.6 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/atak-civ
          GIT_LFS_SKIP_SMUDGE=1 git clone --filter=blob:none --no-checkout \
            https://github.com/TAK-Product-Center/atak-civ.git /tmp/atak-civ
          git -C /tmp/atak-civ fetch --depth 1 origin "$ATAK_CIV_SOURCE_SHA"
          git -C /tmp/atak-civ checkout --detach "$ATAK_CIV_SOURCE_SHA"

          grep -n "ATAK_VERSION = '5.6.0'" \
            /tmp/atak-civ/plugin-examples/helloworld/app/build.gradle

      - name: Build ATAK 5.6 TakDev Gradle plugin
        shell: bash
        working-directory: /tmp/atak-civ/atak-gradle-takdev
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :atak-gradle-takdev:jar

      - name: Download public ATAK API compile stub
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/atak-public-sdk /tmp/atak-public-sdk.zip
          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/atak-public-sdk.zip \
            "https://github.com/TAK-Product-Center/atak-civ/releases/download/5.5.1.8/ATAK-CIV-5.5.1.8-SDK.zip"
          # Verify the official release archive against its pinned SHA-256.
          sha256sum /tmp/atak-public-sdk.zip
          echo "${ATAK_PUBLIC_SDK_SHA256}  /tmp/atak-public-sdk.zip" | sha256sum -c -
          mkdir -p /tmp/atak-public-sdk
          unzip -q /tmp/atak-public-sdk.zip -d /tmp/atak-public-sdk

      - name: Prepare ATAK 5.6 DevKit files
        shell: bash
        run: |
          set -euxo pipefail

          TAKDEV="$(find /tmp/atak-civ/atak-gradle-takdev/atak-gradle-takdev/build/libs -type f -name 'atak-gradle-takdev*.jar' | head -n 1)"
          MAINJAR="$(find /tmp/atak-public-sdk -type f -name 'main.jar' | head -n 1)"
          KEYSTORE="/tmp/atak-civ/atak/android_keystore"
          CORERULES="/tmp/atak-civ/atak/ATAK/app/proguard-release-keep.txt"

          echo "TAKDEV=$TAKDEV"
          echo "MAINJAR=$MAINJAR"
          echo "KEYSTORE=$KEYSTORE"
          echo "CORERULES=$CORERULES"

          test -f "$TAKDEV"
          test -f "$MAINJAR"
          test -f "$KEYSTORE"
          test -f "$CORERULES"

          cp "$TAKDEV" ./atak-gradle-takdev.jar

          mkdir -p sdk
          cp "$MAINJAR" sdk/main.jar
          cp "$KEYSTORE" sdk/android_keystore
          cp "$CORERULES" sdk/proguard-release-keep.txt
          : > sdk/mapping.txt

          echo "5.6 source signing key:"
          sha256sum sdk/android_keystore
          echo "Compile stub:"
          sha256sum sdk/main.jar

      - name: Build RELEASE Jarnsen Mrs Plugin for ATAK 5.6.0
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleCivRelease

      - name: Run JVM regression tests
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --stacktrace :app:testCivReleaseUnitTest

      - name: Lint ATAK plugin
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --stacktrace :app:lintCivRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs -type f -name '*.apk' | head -n 1)"
          test -f "$APK"
          echo "APK=$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Show APKs
        if: always()
        shell: bash
        run: |
          find app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true

      - name: Create and validate TAK.gov source archive
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(sed -n 's/.*ext.PLUGIN_VERSION = "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          test -n "$VERSION"

          SOURCE_ZIP="Jarnsen-Mrs-Plugin-${VERSION}-TAKgov-Source.zip"
          SOURCE_SHA_FILE="${SOURCE_ZIP}.sha256"
          SOURCE_LIST="${RUNNER_TEMP}/takgov-source-files.txt"
          ROOT_DIR="Jarnsen-Mrs-Plugin"

          # Build the upload strictly from tracked Git content. This keeps local
          # SDK files, build outputs, signing material and .git data out. TAK.gov
          # requires exactly one project folder at the archive root.
          git archive --format=zip --prefix="${ROOT_DIR}/" --output="$SOURCE_ZIP" HEAD
          unzip -t "$SOURCE_ZIP"
          unzip -Z1 "$SOURCE_ZIP" > "$SOURCE_LIST"

          # Every archive member must live below the single project root.
          if grep -Ev "^${ROOT_DIR}/" "$SOURCE_LIST"; then
            echo "::error::TAK.gov archive contains entries outside the single project root"
            exit 1
          fi

          # TAK.gov needs the actual source project, not an already-built APK.
          for required in \
            "${ROOT_DIR}/README.md" \
            "${ROOT_DIR}/build.gradle" \
            "${ROOT_DIR}/settings.gradle" \
            "${ROOT_DIR}/gradlew" \
            "${ROOT_DIR}/gradle/wrapper/gradle-wrapper.jar" \
            "${ROOT_DIR}/gradle/wrapper/gradle-wrapper.properties" \
            "${ROOT_DIR}/app/build.gradle" \
            "${ROOT_DIR}/app/src/main/AndroidManifest.xml"
          do
            grep -Fxq "$required" "$SOURCE_LIST"
          done

          # Fail closed if signing material, local config or generated DevKit
          # files ever become tracked by mistake.
          if grep -Eqi '(^|/)(local\.properties|keystore\.properties|\.env([^/]*)?|id_rsa|id_ed25519)$|\.(jks|keystore|pem|p12|pfx)$|(^|/)sdk/android_keystore$|(^|/)atak-gradle-takdev\.jar$|(^|/)(build|\.gradle|\.git)/' "$SOURCE_LIST"; then
            echo "::error::TAK.gov source archive contains a forbidden generated, local or signing file"
            grep -Ei '(^|/)(local\.properties|keystore\.properties|\.env([^/]*)?|id_rsa|id_ed25519)$|\.(jks|keystore|pem|p12|pfx)$|(^|/)sdk/android_keystore$|(^|/)atak-gradle-takdev\.jar$|(^|/)(build|\.gradle|\.git)/' "$SOURCE_LIST" || true
            exit 1
          fi

          sha256sum "$SOURCE_ZIP" | tee "$SOURCE_SHA_FILE"

          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "SOURCE_SHA_FILE=$SOURCE_SHA_FILE" >> "$GITHUB_ENV"

      - name: Upload TAK.gov source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarnsen-Mrs-Plugin-${{ env.PLUGIN_VERSION }}-TAKgov-Source
          path: |
            ${{ env.SOURCE_ZIP }}
            ${{ env.SOURCE_SHA_FILE }}
          if-no-files-found: error

      - name: Upload plugin APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarnsen-Mrs-Plugin-ATAK-5.6.0-RELEASE
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
