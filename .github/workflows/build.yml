name: Build ATAK Plugin

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 36
        shell: bash
        run: |
          set -euxo pipefail
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Download ATAK DevKit API
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/atak-sdk /tmp/atak-sdk.zip
          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/atak-sdk.zip \
            "https://github.com/TAK-Product-Center/atak-civ/releases/download/5.5.1.8/ATAK-CIV-5.5.1.8-SDK.zip"
          mkdir -p /tmp/atak-sdk
          unzip -q /tmp/atak-sdk.zip -d /tmp/atak-sdk

      - name: Download ATAK 5.6 public signing keystore
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/atak-56-keystore \
            "https://raw.githubusercontent.com/TAK-Product-Center/atak-civ/main/atak/android_keystore"
          keytool -list -v \
            -keystore /tmp/atak-56-keystore \
            -storepass tnttnt \
            -alias wintec_mapping

      - name: Verify public key is accepted by ATAK 5.6 Release
        shell: bash
        run: |
          set -euxo pipefail
          keytool -exportcert \
            -keystore /tmp/atak-56-keystore \
            -storepass tnttnt \
            -alias wintec_mapping \
            -file /tmp/atak-plugin-cert.der

          CERTHEX="$(xxd -p -c 1000000 /tmp/atak-plugin-cert.der | tr -d '\n' | tr 'A-F' 'a-f')"
          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/AtakPluginRegistry.java \
            "https://raw.githubusercontent.com/TAK-Product-Center/atak-civ/main/atak/ATAK/app/src/main/java/com/atak/plugins/impl/AtakPluginRegistry.java"

          if grep -Fqi "$CERTHEX" /tmp/AtakPluginRegistry.java; then
            echo "Public ATAK keystore certificate is in the ATAK 5.6 acceptable plugin key list."
          else
            echo "Public ATAK keystore certificate is NOT in the ATAK 5.6 acceptable plugin key list."
            exit 42
          fi

      - name: Prepare ATAK DevKit files
        shell: bash
        run: |
          set -euxo pipefail
          TAKDEV="$(find /tmp/atak-sdk -type f -name 'atak-gradle-takdev*.jar' | head -n 1)"
          MAINJAR="$(find /tmp/atak-sdk -type f -name 'main.jar' | head -n 1)"
          MAPPING="$(find /tmp/atak-sdk -type f -name 'mapping.txt' | head -n 1)"
          CORERULES="$(find /tmp/atak-sdk -type f -name 'proguard-release-keep.txt' | head -n 1)"

          test -n "$TAKDEV"
          test -n "$MAINJAR"

          cp "$TAKDEV" ./atak-gradle-takdev.jar
          mkdir -p sdk
          cp "$MAINJAR" sdk/main.jar
          cp /tmp/atak-56-keystore sdk/android_keystore

          if [ -n "$MAPPING" ]; then cp "$MAPPING" sdk/mapping.txt; else : > sdk/mapping.txt; fi
          if [ -n "$CORERULES" ]; then cp "$CORERULES" sdk/proguard-release-keep.txt; else : > sdk/proguard-release-keep.txt; fi

      - name: Build CIV debug APK for ATAK 5.6.0
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace :app:assembleCivDebug

      - name: Verify APK certificate
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload plugin APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarnsen-Mrs-Plugin-ATAK-5.6.0
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
